name: Release

# Pushing a version tag (e.g. v0.1.0) kicks off the release builds.
on:
  push:
    tags:
      - "v*"

# Bundling works: the macOS .app/.dmg builds with libghostty-vt.dylib bundled
# into Contents/Frameworks and resolved via a baked rpath (no runtime
# DYLD_LIBRARY_PATH). See docs/technical/packaging-and-distribution.md.
#
# Release builds must be signed, notarized, and updater-signed. Missing secrets
# fail fast before the long build so a tag never produces an installable-looking
# artifact that Gatekeeper rejects.
# Reverie targets macOS (Apple Silicon) only.

permissions:
  contents: write # needed to create the GitHub Release and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release (macOS, Apple Silicon)
    # Pinned to macos-15 (arm64). macos-26 was tried and does not work: on that
    # image Zig 0.15.2 cannot link its own build runner against libSystem, so
    # libghostty-vt fails to build with a flood of undefined symbols (_abort,
    # _free, __availability_version_check). It is not macOS 26 itself: a clean
    # libghostty-vt build with the same Zig against SDK 26.2 links fine locally,
    # and the non-release CI job builds on macos-26. It is specific to the runner
    # image, and a fresh Zig cache does not help. Moving here likely needs Zig
    # 0.16, which upstream libghostty-rs now requires anyway.
    #
    # The SDK version still matters even though we build on macos-15: macOS reads
    # it from LC_BUILD_VERSION to pick the design language, and the macOS 15 SDK
    # gives Reverie legacy 16pt window corners on Tahoe while every system window
    # beside it uses 26pt. The build step below declares the newer SDK instead.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Pull the release notes for this tag from CHANGELOG.md (the single source
      # of truth) and hand them to tauri-action as the GitHub Release body. Runs
      # before the long build so a missing changelog entry fails the release fast.
      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          {
            echo 'notes<<__CHANGELOG_EOF__'
            node scripts/changelog-extract.mjs "${GITHUB_REF_NAME}"
            echo '__CHANGELOG_EOF__'
          } >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      # libghostty-vt requires the Zig 0.15.x toolchain to build.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Verify release signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required release secret(s): ${missing[*]}" >&2
            echo "Reverie releases must be signed, notarized, and updater-signed before distribution." >&2
            exit 1
          fi
      # Build the web assets up front so frontendDist exists before bundling.
      - name: Build web assets
        run: npm run build:web
      - name: Build and publish the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Declare the macOS 26 SDK in LC_BUILD_VERSION without compiling
          # against it. macOS reads that field (not the headers you compiled
          # with) to decide which design language an app gets: linked against
          # this runner's macOS 15 SDK, Reverie draws legacy 16pt window corners
          # on Tahoe while every system window beside it uses 26pt. Verified by
          # building the same source twice and changing only this field.
          #
          # This is only safe because Reverie reaches AppKit exclusively through
          # runtime objc2 message sends, never a compile-time SDK symbol, so no
          # macOS 26 headers are needed. If that ever stops being true, this has
          # to become a real SDK 26 build instead.
          #
          # The deployment target is unchanged: minos stays 11.0, so this does
          # not raise the minimum supported macOS. Scoped to the target triple so
          # host build scripts and proc macros link normally.
          CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS: -C link-arg=-Wl,-platform_version,macos,11.0,26.0
          # macOS code signing + notarization.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Auto-updater signing: the Tauri minisign key (separate from Apple
          # signing) that signs the .app.tar.gz the updater downloads.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop/src-tauri
          args: --target aarch64-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: Reverie ${{ github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: true
          prerelease: false

      # Guard against ever shipping a broken bundle again. v0.5.0 shipped a
      # 0-byte libghostty-vt.dylib (a build-script staging race) and aborted at
      # launch with a dyld "Library not loaded" error. Fail the release here,
      # before notarizing/publishing, if the bundled dylib is missing, empty, or
      # not a Mach-O binary.
      - name: Verify bundled Ghostty dylib
        run: |
          set -euo pipefail
          APP=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "No .app bundle found to verify." >&2
            exit 1
          fi
          DYLIB="$APP/Contents/Frameworks/libghostty-vt.dylib"
          if [ ! -s "$DYLIB" ]; then
            echo "Bundled Ghostty dylib is missing or empty: $DYLIB" >&2
            exit 1
          fi
          if ! file "$DYLIB" | grep -q 'Mach-O'; then
            echo "Bundled Ghostty dylib is not a Mach-O binary:" >&2
            file "$DYLIB" >&2
            exit 1
          fi
          echo "OK: $DYLIB ($(stat -f%z "$DYLIB") bytes)"
          file "$DYLIB"

      # tauri-action notarizes and staples the .app but leaves the .dmg wrapper
      # signed-but-unnotarized, which makes recent macOS show a one-time "cannot
      # verify" prompt when the user first opens the downloaded DMG. Notarize and
      # staple the DMG too, then replace the asset on the draft release.
      - name: Notarize and staple the DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DMG=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          if [ -z "$DMG" ]; then
            echo "No DMG found to notarize." >&2
            exit 1
          fi
          echo "Notarizing DMG: $DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "Re-uploading stapled DMG to release ${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" "$DMG" --clobber
